name: Deploy Roblox Experience Configs

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-experience-configs
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and publish Roblox Configs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show repository files
        run: |
          pwd
          echo "===== ROOT ====="
          ls -la
          echo "===== CONFIGS ====="
          find configs -maxdepth 2 -type f -print || true

      - name: Publish configs to Roblox
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: python3 scripts/deploy_experience_configs.py
