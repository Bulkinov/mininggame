name: Deploy Roblox Configs — PROD

on:
  push:
    branches:
      - main
    paths:
      - ".deploy/prod.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-configs-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish configs to PROD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Publish PROD configs
        env:
          ROBLOX_ENV: PROD
          ROBLOX_UNIVERSE_ID: "10590998713"
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: python3 scripts/deploy_experience_configs.py
