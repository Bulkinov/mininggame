name: Daily Config Backup

on:
  schedule:
    # 23:00 UTC = 02:00 Moscow
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-config-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create daily snapshot
        shell: bash
        run: |
          set -euo pipefail

          DATE="$(TZ=Europe/Moscow date +%F)"
          DEST="backlog/${DATE}"

          if [ -d "${DEST}" ]; then
            echo "Snapshot ${DEST} already exists."
            exit 0
          fi

          mkdir -p "${DEST}"
          cp -a configs/. "${DEST}/"

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path

          now = datetime.now(ZoneInfo("Europe/Moscow"))
          dest = Path("backlog") / now.strftime("%Y-%m-%d")

          meta = {
              "sourceCommit": os.environ.get("GITHUB_SHA", ""),
              "createdAtMoscow": now.isoformat(),
              "sourcePath": "configs",
          }

          (dest / "_meta.json").write_text(
              json.dumps(meta, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain backlog/)" ]; then
            echo "No backup changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backlog/
          git commit -m "backup: configs $(TZ=Europe/Moscow date +%F)"
          git push
